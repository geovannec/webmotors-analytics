version: "3.8"

services:
  warp:
    image: caomingjun/warp:latest
    container_name: webmotors_warp
    restart: always
    environment:
      - WARP_SLEEP=2
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - warp_data:/var/lib/cloudflare-warp

  web:
    image: webmotors-web:latest
    build:
      context: https://github.com/geovannec/webmotors-analytics.git#main
      dockerfile: Dockerfile
    container_name: webmotors_web
    restart: always
    command: uvicorn web.server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - webmotors_data:/app/data

  dashboard:
    image: webmotors-dashboard:latest
    build:
      context: https://github.com/geovannec/webmotors-analytics.git#main
      dockerfile: Dockerfile
    container_name: webmotors_dashboard
    restart: always
    command: streamlit run app/dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - webmotors_data:/app/data

  crawler:
    image: webmotors-crawler:latest
    build:
      context: https://github.com/geovannec/webmotors-analytics.git#main
      dockerfile: Dockerfile
    container_name: webmotors_crawler
    restart: always
    depends_on:
      - warp
    environment:
      - ALL_PROXY=socks5h://warp:1080
      - HTTP_PROXY=socks5h://warp:1080
      - HTTPS_PROXY=socks5h://warp:1080
    command: python run_daemon.py --interval 3600 --tier all --brands-cat all --pages-per-shard 0
    volumes:
      - webmotors_data:/app/data

volumes:
  webmotors_data:
  warp_data:
